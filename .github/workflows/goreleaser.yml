name: goreleaser

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.11.1)'
        required: true
        type: string
  push:
    tags:
      - 'v3.**'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - run: git fetch --force --tags

      - name: go dependency
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup QEMU (docker multi-arch dependency)
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker Buildx (docker multi-arch dependency)
        uses: docker/setup-buildx-action@v2

      - name: dockerhub-login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
